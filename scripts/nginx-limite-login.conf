# Límite de intentos de login y registro por IP (F10). Va en el contexto http,
# así que no hay que tocar el sitio de la app:
#
#   sudo cp nginx-limite-login.conf /etc/nginx/conf.d/subastas-limite-login.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# El bloqueo por cédula (5 fallos en 15 min) sigue en la base. Esto frena además
# a quien prueba muchas cédulas desde una misma IP.

# Tailscale Funnel entrega las visitas de internet desde 127.0.0.1 con la IP real
# en X-Forwarded-For. Solo se le cree a 127.0.0.1: desde la LAN no se puede falsear.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

# Clave vacía = sin límite: solo cuentan el login y el registro de cuenta
map $uri $subastas_login_ip {
    ~^/rest/v1/rpc/(autenticar_usuario|registrar_nuevo_usuario)$  $binary_remote_addr;
    default                                                      "";
}

# 20 por minuto y ráfaga de 40 por IP: holgado para una oficina detrás de una
# misma IP, corto para un ataque. Excedido, responde 429.
limit_req_zone $subastas_login_ip zone=subastas_login:10m rate=20r/m;
limit_req zone=subastas_login burst=40 nodelay;
limit_req_status 429;
