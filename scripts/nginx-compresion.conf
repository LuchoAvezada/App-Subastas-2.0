# Compresión gzip de JS, CSS, SVG y JSON de la API. El nginx.conf de Mint trae
# "gzip on" pero sin gzip_types, así que solo comprimía el HTML: el bundle de JS
# viajaba entero (~800 KB por visita). Va en el contexto http:
#
#   sudo cp nginx-compresion.conf /etc/nginx/conf.d/subastas-compresion.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verificar (debe mostrar "Content-Encoding: gzip"):
#   curl -sI -H 'Accept-Encoding: gzip' http://localhost/assets/<bundle>.js | grep -i content-encoding

# "gzip on" ya está en nginx.conf; repetirlo aquí daría "directive is duplicate".
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
